name: Task
description: A scoped piece of work
title: "[task]: "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: >-
        What kind of work is this? Areas say what the job needs, not which code
        it touches — the zone is worked out from the files a PR changes. See
        docs/AREAS.md.
      options:
        - content
        - product
        - engineering
        - coordination
        - not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs to happen
      description: Scope it so one person can own it end-to-end.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
    validations:
      required: false
