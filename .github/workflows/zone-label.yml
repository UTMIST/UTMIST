name: Label PR zone

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  label-zone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          # Never strip manually-applied zone labels: with sync-labels on,
          # a maintainer's hand-applied label is removed on the next push
          # if the PR's changed files match no glob for it.
          sync-labels: false
