name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v7

      # client/.nvmrc is the single source of truth for the Node version, read
      # here and by every other job below, so local dev and CI cannot drift.
      # A matrix entry naming the version again would be a second copy to
      # forget — which is how this repo ended up gating on 22 while Vercel
      # deployed on 24.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint, typecheck and test need no secrets. The suite provisions its own
      # environment: jest.setup.js sets the Supabase vars, and the eigenai test
      # sets and unsets NEXT_PUBLIC_GOOGLE_MAPS_API_KEY itself to cover both the
      # present and missing cases. Injecting those vars here would break it.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Dependabot and fork PRs cannot read this repo's secrets (Dependabot runs
      # against a separate secret store, forks against none), so these come out
      # empty there. Three pages throw on a missing value rather than degrading:
      # shared/lib/supabase/client.ts throws at module load, and eigenai.tsx
      # throws on render. Either one fails the prerender and turns every such PR
      # red, whatever the PR actually changed.
      #
      # So every var the prerender can throw on needs a fallback here, not just
      # the ones that happen to have bitten us — a page added later that throws
      # on a new var will fail these PRs the same way, and the failure will look
      # like the dependency bump's fault. The placeholders only have to parse,
      # not resolve: nothing is fetched at build time (no generateStaticParams,
      # no build-time queries, the server client is only reached behind
      # cookies), and the Maps key is read to build a client-side embed URL.
      # Real secrets still win wherever they are readable.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || 'placeholder-maps-key' }}

  preview:
    needs: build
    # Fork PRs can't read repo secrets, so only same-repo branches get previews.
    # Dependabot branches live in this repo and so pass that test, but a
    # Dependabot run reads the Dependabot secret store rather than this one:
    # VERCEL_TOKEN comes out empty and `vercel pull` fails on every dependency
    # PR. Putting a real deploy token in that store would hand it to a run whose
    # lockfile just changed, so previews are skipped for Dependabot instead —
    # build, lint, typecheck and tests still gate those PRs. For a bump that
    # warrants a visual check, push the branch under your own name and open a
    # PR from it.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    concurrency:
      group: vercel-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v7

      # `vercel build` runs the Next build here on the runner, so without this
      # it used whatever Node the image happened to ship — the gate ran one
      # version and the artifact we actually deploy was built on another.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Deploy Preview to Vercel
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- vercel-preview-comment -->';
            const url = '${{ steps.deploy.outputs.url }}';
            const sha = context.payload.pull_request.head.sha;
            const body = [
              marker,
              '### Vercel preview',
              '',
              `| Deployment | Commit |`,
              `| --- | --- |`,
              `| ${url} | \`${sha.slice(0, 7)}\` |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v7

      # Same reason as the preview job: this builds the artifact that goes to
      # production, so it has to be the version the gate ran on.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}