name: Taxonomy consistency

# Zones (PRs, by code touched) and areas (issues, by kind of work) are two
# independent lists, each repeated across several hand-maintained files. This
# checks both, and checks they have not leaked into each other.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # zone sources
      - ".github/labeler.yml"
      - ".github/CODEOWNERS"
      - "docs/ZONES.md"
      - "client/eslint.config.mjs"
      - "client/src/features/**"
      # area sources
      - ".github/ISSUE_TEMPLATE/task.yml"
      - ".github/workflows/area-label-issues.yml"
      - "docs/AREAS.md"
      # the checker itself
      - ".github/workflows/taxonomy-consistency.yml"
      - "scripts/check-taxonomy.mjs"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
      - name: Check zone and area mapping consistency
        run: node scripts/check-taxonomy.mjs

      # Zone labels are only half of review routing — CODEOWNERS is what turns
      # a zone into a reviewer. GitHub silently drops any CODEOWNERS line whose
      # owner does not exist or lacks write access, so a fully broken file is
      # indistinguishable from a working one until someone notices reviews are
      # never requested. (That is not hypothetical: every line named a
      # non-existent user for the file's entire life before this check.)
      # Ask GitHub to parse the copy on THIS ref, not the default branch, or a
      # PR fixing CODEOWNERS would be graded against the broken version.
      - name: Check CODEOWNERS resolves
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          errors=$(gh api "repos/$REPO/codeowners/errors?ref=$REF" --jq '.errors | length')
          if [ "$errors" -gt 0 ]; then
            echo "::error::CODEOWNERS has $errors unresolvable line(s) — those paths route to nobody."
            gh api "repos/$REPO/codeowners/errors?ref=$REF" \
              --jq '.errors[] | "line \(.line): \(.message)"'
            exit 1
          fi
          echo "CODEOWNERS resolves cleanly."
