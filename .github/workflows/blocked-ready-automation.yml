name: Ready label automation

# Keeps the `ready` label in sync with
# GitHub's NATIVE issue dependencies. Declare a dependency in the issue's
# "Blocked by" section in the GitHub UI; this workflow only ever reads it, so
# the dependency graph stays the single source of truth.
#
#   ready : every blocker is closed, and nobody has claimed the issue
#
# There is deliberately no `blocked` label. GitHub indexes dependency state
# itself, so `is:blocked` in issue search returns exactly the set a label would
# have carried — verified as an identical set, not merely an equal count. A
# label would be a second copy of that fact and could drift; the search
# qualifier is computed at query time and cannot. Use `-is:blocked` to find
# work that is available.
#
# `ready` has no such replacement: it means "this WAS blocked and now isn't,
# and nobody has claimed it", which is a transition rather than a state.
# `-is:blocked no:assignee` is a different, much larger set - it includes
# everything that was never blocked to begin with.
#
# Opt-in by design: an issue that declares no dependencies never gets `ready`.
#
# Triggers, and why each is here:
# - opened / assigned / unassigned — re-evaluate that one issue. Claiming an
#   issue drops `ready` (it is no longer up for grabs); fully unassigning it
#   puts it back.
# - closed / reopened — re-evaluate everything the issue was blocking, found
#   through the native `blocking` edge. Closing the last blocker is the event
#   that flips a dependent to `ready`.
# - schedule — GitHub emits `issue_dependencies` webhooks when a dependency is
#   added or removed, but that event CANNOT trigger Actions (it is absent from
#   the supported list in
#   docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows).
#   The sweep is what closes that gap: a dependency added in the UI is picked
#   up within the interval instead of never. This is the only reason cron is
#   here — drop it and dependency edits go unnoticed until the issue is next
#   opened/closed/assigned.
# - workflow_dispatch — the same sweep, on demand.
#
# Every write is conditional on the issue's current labels, so a sweep with
# nothing to do performs no writes and leaves no timeline noise.
#
# Project Status records progress only: Not Started, In Development, In Review,
# Done. Dependencies never change it; an in-progress issue can also be blocked.
# This workflow needs only the repository token, with no project credential.

on:
  issues:
    types: [opened, closed, reopened, assigned, unassigned]
  schedule:
    # Dependency add/remove reaches Actions no other way. Note GitHub disables
    # cron in repos with no pushes for 60 days — re-enable in the Actions tab.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

# Serialize per issue; sweeps serialize against each other. Queue rather than
# cancel — a cancelled run would leave its dependents half-synced.
concurrency:
  group: blocked-ready-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  sync-blockers:
    runs-on: ubuntu-latest
    steps:
      - name: Sync ready label
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;

            // --- Reading native dependencies ---------------------------------
            // `blockedBy` / `blocking` are the GitHub-native dependency edges.
            // GraphQL `issues` excludes pull requests, so no PR filtering here.
            const ISSUE_FIELDS = `
              number
              state
              assignees(first: 1) { totalCount }
              labels(first: 100) { nodes { name } }
              blockedBy(first: 100) { totalCount nodes { number state } }`;

            const fetchIssue = async (number) => {
              const data = await github.graphql(
                `query($owner:String!,$repo:String!,$number:Int!){
                   repository(owner:$owner,name:$repo){ issue(number:$number){ ${ISSUE_FIELDS} } } }`,
                { owner, repo, number },
              );
              return data.repository.issue;
            };

            const fetchAllOpen = async () => {
              const out = [];
              let cursor = null;
              for (;;) {
                const data = await github.graphql(
                  `query($owner:String!,$repo:String!,$cursor:String){
                     repository(owner:$owner,name:$repo){
                       issues(first: 100, states: OPEN, after: $cursor){
                         pageInfo { hasNextPage endCursor }
                         nodes { ${ISSUE_FIELDS} } } } }`,
                  { owner, repo, cursor },
                );
                const page = data.repository.issues;
                out.push(...page.nodes);
                if (!page.pageInfo.hasNextPage) break;
                cursor = page.pageInfo.endCursor;
              }
              return out;
            };

            // Open issues that the given issue blocks — the set to re-evaluate
            // when it closes or reopens.
            const fetchBlocking = async (number) => {
              const data = await github.graphql(
                `query($owner:String!,$repo:String!,$number:Int!){
                   repository(owner:$owner,name:$repo){ issue(number:$number){
                     blocking(first: 100){ nodes { number state } } } } }`,
                { owner, repo, number },
              );
              return data.repository.issue.blocking.nodes
                .filter((n) => n.state === 'OPEN')
                .map((n) => n.number);
            };

            // --- Writes ------------------------------------------------------
            const addLabel = async (n, name) => {
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [name] });
                return true;
              } catch (e) { core.warning(`#${n}: add '${name}' failed: ${e.message}`); return false; }
            };

            const removeLabel = async (n, name) => {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name });
                return true;
              } catch (e) {
                // 404 just means it wasn't there — nothing to report.
                if (e.status !== 404) core.warning(`#${n}: remove '${name}' failed: ${e.message}`);
                return false;
              }
            };

            // --- State machine -----------------------------------------------
            const desiredFor = (iss) => {
              const openBlockers = iss.blockedBy.nodes.filter((b) => b.state === 'OPEN');
              if (iss.blockedBy.totalCount === 0) {
                // Not in the dependency graph. Never label it — only clear
                // labels left behind when its last dependency was removed.
                return { ready: false, why: 'no dependencies — label cleared' };
              }
              if (openBlockers.length > 0) {
                return {
                  ready: false,
                  why: `blocked by ${openBlockers.map((b) => '#' + b.number).join(', ')}`,
                };
              }
              if (iss.assignees.totalCount > 0) {
                // Unblocked, but claimed — not up for grabs.
                return { ready: false, why: 'unblocked but claimed' };
              }
              return { ready: true, why: 'all blockers closed' };
            };

            const reconcile = async (iss) => {
              if (!iss) return;
              const has = (name) => iss.labels.nodes.some((l) => l.name === name);

              // A closed issue is not available.
              if (iss.state !== 'OPEN') {
                if (has('ready')) await removeLabel(iss.number, 'ready');
                return;
              }

              const d = desiredFor(iss);
              let changed = false;
              if (d.ready !== has('ready')) {
                const ok = d.ready
                  ? await addLabel(iss.number, 'ready')
                  : await removeLabel(iss.number, 'ready');
                changed = changed || ok;
              }

              if (changed) core.info(`#${iss.number}: ${d.why}.`);
            };

            // --- Dispatch ------------------------------------------------------
            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              const all = await fetchAllOpen();
              core.info(`Sweep: checking ${all.length} open issue(s).`);
              for (const iss of all) await reconcile(iss);
              return;
            }

            const number = context.payload.issue.number;
            const action = context.payload.action;

            // Always re-evaluate the issue the event fired on.
            await reconcile(await fetchIssue(number));

            // Closing the last blocker is what makes a dependent ready, so fan
            // out to whatever this issue blocks.
            if (action === 'closed' || action === 'reopened') {
              const dependents = await fetchBlocking(number);
              if (dependents.length === 0) {
                core.info(`No open issues are blocked by #${number}.`);
                return;
              }
              for (const dep of dependents) await reconcile(await fetchIssue(dep));
            }
