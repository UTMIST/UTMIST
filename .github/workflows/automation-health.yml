name: Check automation health

on:
  schedule:
    - cron: '47 12 * * *'
  workflow_run:
    workflows: [Sync project board, Review board exceptions, Check PR issue links, Record deployment evidence]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview findings without creating or updating the incident
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: utmist-automation-health
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Never consume code or artifacts from the triggering workflow.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Inspect workflow health independently of board synchronization
        uses: actions/github-script@v9
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { health, healthDryRun } = require('./.github/scripts/board-reports.cjs');
            const result = await health({ github, ...context.repo,
              projectGraphql: process.env.PROJECTS_TOKEN ? (query, variables) => github.graphql(query, {
                ...variables, headers: { authorization: `token ${process.env.PROJECTS_TOKEN}` },
              }) : null,
              dryRun: healthDryRun(context, process.env.DRY_RUN === 'true') });
            for (const finding of result.findings) core.warning(finding);
            await core.summary.addHeading('Automation health')
              .addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
