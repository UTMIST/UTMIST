name: Record deployment evidence

on:
  # GITHUB_TOKEN deployment writes do not trigger deployment_status workflows.
  # workflow_run is the supported completion boundary for the production job.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed main CI run ID to inspect
        type: number
        required: true
      dry_run:
        description: Preview evidence without commenting
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  deployments: read
  issues: write
  pull-requests: write

concurrency:
  group: deployment-evidence-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Attach verified Vercel deployment evidence
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { evidence } = require('./.github/scripts/deployment-evidence.cjs');
            const result = await evidence({ github, ...context.repo,
              runId: Number(process.env.RUN_ID), dryRun: process.env.DRY_RUN === 'true' });
            await core.summary.addHeading('Deployment evidence')
              .addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
