name: Review board exceptions

on:
  schedule:
    - cron: '43 13 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the weekly report without writing
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: utmist-board-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Consolidate exceptions and epic acceptance candidates
        uses: actions/github-script@v9
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            if (!process.env.PROJECTS_TOKEN) throw new Error('PROJECTS_TOKEN is required for project priorities');
            const { review } = require('./.github/scripts/board-reports.cjs');
            const result = await review({ github, ...context.repo,
              projectGraphql: (query, variables) => github.graphql(query, {
                ...variables, headers: { authorization: `token ${process.env.PROJECTS_TOKEN}` },
              }),
              dryRun: process.env.DRY_RUN === 'true' });
            await core.summary.addHeading('Weekly board review')
              .addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
