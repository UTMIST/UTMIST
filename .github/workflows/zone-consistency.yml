name: Zone consistency

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/labeler.yml"
      - ".github/CODEOWNERS"
      - "docs/ZONES.md"
      - ".github/ISSUE_TEMPLATE/task.yml"
      - ".github/workflows/zone-label-issues.yml"
      - ".github/workflows/zone-consistency.yml"
      - "client/eslint.config.mjs"
      - "client/src/features/**"
      - "scripts/check-zones.mjs"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
      - name: Check zone mapping consistency
        run: node scripts/check-zones.mjs
