<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UTMIST · About and impact before and after</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f8f9fa; color: #111827; font-family: system-ui, sans-serif; }
    main { max-width: 1560px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 20px; margin-bottom: 24px; }
    h1 { font-size: clamp(24px, 3vw, 36px); font-weight: 600; letter-spacing: -.04em; margin: 4px 0 8px; }
    p { color: #5c5c5c; line-height: 1.6; margin: 0; }
    .brand { color: #1e19b1; font-size: 13px; font-weight: 600; }
    .controls { display: flex; gap: 6px; }
    button { cursor: pointer; min-height: 44px; padding: 10px 16px; border: 1px solid #d9d9d9; border-radius: 8px; background: white; color: inherit; font: inherit; font-size: 14px; }
    button[aria-pressed="true"] { color: white; background: #20145f; border-color: #20145f; }
    :focus-visible { outline: 3px solid #1e19b1; outline-offset: 4px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    figure { min-width: 0; margin: 0; }
    figcaption { margin-bottom: 10px; font-weight: 600; font-size: 14px; }
    .frame { overflow: hidden; border-radius: 10px; aspect-ratio: 1440 / 1250; background: #20145f; }
    img { display: block; width: 100%; height: auto; }
    .overlay { position: relative; max-width: 1080px; margin: auto; }
    .overlay .before { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--split, 50%)) 0 0); }
    .overlay::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--split, 50%); width: 2px; background: white; }
    .slider { display: flex; align-items: center; gap: 16px; max-width: 720px; margin: 18px auto 0; font-size: 14px; }
    input { flex: 1; min-width: 80px; min-height: 44px; accent-color: #1e19b1; }
    footer { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; margin-top: 20px; font-size: 13px; }
    a { color: #1e19b1; text-underline-offset: 3px; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) { body { padding: 20px; } .pair { grid-template-columns: 1fr; gap: 24px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="brand">UTMIST / About section</p>
        <h1>About section: before and after</h1>
        <p>A smaller photo, one projects action, and simpler impact cards.</p>
      </div>
      <div class="controls" role="group" aria-label="Comparison view">
        <button type="button" aria-pressed="true" data-view="pair">Side by side</button>
        <button type="button" aria-pressed="false" data-view="slide">Slide to compare</button>
      </div>
    </header>
    <section class="pair" id="pair" aria-label="Before and after screenshots">
      <figure>
        <figcaption>Before</figcaption>
        <a href="about-reform-before.png" aria-label="Open the full before screenshot"><div class="frame"><img src="about-reform-before.png" alt="Wide team photo cropped through the people, a large footprint heading, a repeated projects button and detailed metric cards." width="1440" height="1250"></div></a>
      </figure>
      <figure>
        <figcaption>After</figcaption>
        <a href="about-reform-desktop.png" aria-label="Open the full after screenshot"><div class="frame"><img src="about-reform-desktop.png" alt="Introduction beside a smaller photo preserving every person, followed by a compact centered dashboard meeting the purple mission band." width="1440" height="1250"></div></a>
      </figure>
    </section>
    <section id="slide" hidden aria-label="Interactive screenshot comparison">
      <div class="overlay frame">
        <img src="about-reform-desktop.png" alt="After the cleanup" width="1440" height="1250">
        <img class="before" src="about-reform-before.png" alt="Before the cleanup" width="1440" height="1250">
      </div>
      <label class="slider">Before <input type="range" min="0" max="100" value="50" aria-label="Amount of before screenshot shown"> After</label>
    </section>
    <footer>
      <p>Matching 1440px captures. The photo crop removes only excess ceiling.</p>
      <p><a href="about-reform-desktop.png">Full desktop view</a> · <a href="about-reform-mobile.png">Mobile view</a> · <a href="http://localhost:3000/#about-us">Try the live page</a></p>
    </footer>
  </main>
  <script>
    const buttons = document.querySelectorAll('[data-view]');
    buttons.forEach(button => button.addEventListener('click', () => {
      buttons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      document.querySelector('#pair').hidden = button.dataset.view !== 'pair';
      document.querySelector('#slide').hidden = button.dataset.view !== 'slide';
    }));
    document.querySelector('input').addEventListener('input', event => {
      document.querySelector('.overlay').style.setProperty('--split', event.target.value + '%');
    });
  </script>
</body>
</html>
